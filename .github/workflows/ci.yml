name: Course Platform CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven
      - run: mvn -B -ntp package
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.55.0 && npx playwright install --with-deps chromium
      - name: Start isolated test app
        run: |
          mkdir -p test-results
          java -Duser.timezone=Asia/Shanghai -jar target/parallel-volunteer-admission-system-2.0.0.jar > test-results/server.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:8089/api/health && exit 0; sleep 1; done
          cat test-results/server.log
          exit 1
        env:
          PORT: '8089'
          COURSE_DB_URL: 'jdbc:h2:file:./test-results/course;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_ON_EXIT=FALSE'
          BOOTSTRAP_ADMIN_PASSWORD: CiTestOnlyPassword1234
          CREDENTIAL_FILE: ./test-results/admin.txt
      - run: node tools/browser-acceptance.cjs
        env:
          COURSE_ADMIN_PASSWORD: CiTestOnlyPassword1234
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: course-test-results
          path: |
            target/surefire-reports/
            test-results/screenshots/
      - uses: actions/upload-artifact@v4
        with:
          name: course-selection-platform-jar
          path: target/parallel-volunteer-admission-system-2.0.0.jar
