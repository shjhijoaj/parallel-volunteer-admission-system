services:
  mysql:
    image: mysql:8.0
    container_name: enroll-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-enroll_root_pwd}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-db_enroll}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
    ports:
      # 只映射到宿主机的 13306，避免与本机已安装的 MySQL 冲突
      - "${MYSQL_HOST_PORT:-13306}:3306"
    volumes:
      - enroll-mysql-data:/var/lib/mysql
      - ./sql/db_enroll.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${MYSQL_ROOT_PASSWORD:-enroll_root_pwd}"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    container_name: enroll-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-db_enroll}
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-enroll_root_pwd}
      SQL_INIT_MODE: never
      LOGIN_ENABLED: "true"
      ADMIN_NAME: ${ADMIN_NAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      TZ: Asia/Shanghai
    ports:
      - "${APP_PORT:-8080}:8080"

volumes:
  enroll-mysql-data:
