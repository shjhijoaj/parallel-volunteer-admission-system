# 平行志愿录取系统配置
#
# 所有敏感信息都通过环境变量注入，仓库中不保存任何真实账号或密码。
# 本地运行前请设置 MYSQL_PASSWORD；未设置时使用占位默认值，仅用于演示。
server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      timeout: 120m

spring:
  datasource:
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:}
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:db_enroll}?serverTimezone=GMT%2B8&useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&allowMultiQueries=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      initial-size: ${DB_POOL_INITIAL:5}
      min-idle: ${DB_POOL_MIN_IDLE:5}
      max-active: ${DB_POOL_MAX_ACTIVE:20}
      max-wait: 60000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      pool-prepared-statements: true
      max-pool-prepared-statement-per-connection-size: 20
      filters: stat,slf4j
      connection-properties: druid.stat.mergeSql=true;druid.stat.slowSqlMillis=5000
      web-stat-filter:
        enabled: true
        url-pattern: "/*"
        exclusions: "*.js,*.gif,*.jpg,*.bmp,*.png,*.css,*.ico,/druid/*"
      stat-view-servlet:
        enabled: ${DRUID_CONSOLE_ENABLED:false}
        url-pattern: "/druid/*"
        reset-enable: false
        login-username: ${DRUID_CONSOLE_USER:admin}
        login-password: ${DRUID_CONSOLE_PASSWORD:}
      filter:
        wall:
          config:
            multi-statement-allow: true

  # 建表脚本默认不执行：schema.sql 会 DROP 旧表，反复启动会清空数据。
  # 首次初始化时把 SQL_INIT_MODE 设为 always，或者手动执行 sql/db_enroll.sql。
  sql:
    init:
      mode: ${SQL_INIT_MODE:never}
      schema-locations: classpath:sql/schema.sql
      encoding: UTF-8

  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

mybatis:
  configuration:
    map-underscore-to-camel-case: true
  mapper-locations:
    - classpath:mybatis/mapper/*.xml
  type-aliases-package: org.enroll.pojo

enroll:
  login:
    # 打开后，除登录接口与静态资源外的所有请求都需要先登录。
    enabled: ${LOGIN_ENABLED:true}
    admin-name: ${ADMIN_NAME:admin}
    admin-pass: ${ADMIN_PASSWORD:admin123}

logging:
  level:
    org.enroll: info
