server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${PORT:8088}
server.servlet.session.timeout=60m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
spring.datasource.type=com.zaxxer.hikari.HikariDataSource
spring.datasource.url=${COURSE_DB_URL:jdbc:h2:file:./data/course;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${COURSE_DB_USER:sa}
spring.datasource.password=${COURSE_DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=8
spring.datasource.hikari.connection-timeout=10000
spring.sql.init.mode=never
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB
spring.web.resources.static-locations=classpath:/course-ui/
spring.web.resources.cache.cachecontrol.no-cache=true
spring.jackson.time-zone=Asia/Shanghai
server.error.include-message=never
server.error.include-stacktrace=never
app.admin-password=${BOOTSTRAP_ADMIN_PASSWORD:}
app.credential-file=${CREDENTIAL_FILE:./data/admin-credentials.txt}
mybatis.mapper-locations=classpath:/course-mappers/*.xml
logging.level.org.course=INFO
spring.autoconfigure.exclude=com.alibaba.druid.spring.boot.autoconfigure.DruidDataSourceAutoConfigure
